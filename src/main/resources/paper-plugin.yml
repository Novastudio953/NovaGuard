name: NovaGuard
version: 1.8.1
main: com.novaguard.NovaGuard
api-version: '1.21'
author: Nova Studio
description: Original premium anti-cheat with 50 toggleable checks.
website: https://github.com/Novastudio953/NovaGuard
softdepend: [floodgate, Geyser-Spigot]
# NOTE: commands are registered in code (BrigadierBridge) — Paper 26.x
# paper plugins do not support YAML command declarations.
permissions:
  novaguard.admin:
    description: Full NovaGuard admin access
    default: op
  novaguard.alerts:
    description: Receive NovaGuard violation alerts
    default: op
  novaguard.bypass:
    description: Exempt from all NovaGuard checks
    default: op
  novaguard.sus:
    description: Access the suspects GUI
    default: op
