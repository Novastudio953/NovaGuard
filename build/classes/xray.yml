# ============================================================
# NovaGuard v1.2.0 — anti-xray
# ============================================================

xray:
  honeypots-enabled: true
  honeypots-per-cycle: 12
  honeypot-interval-minutes: 10
  max-honeypots: 200
  # alert when a player mines more diamonds than this per hour
  max-diamonds-per-hour: 32
  # flag when this share of mined valuables was never exposed to air
  unexposed-ratio-threshold: 0.55
  unexposed-min-sample: 20
