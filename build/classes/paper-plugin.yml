name: NovaGuard
version: 1.5.0
main: com.novaguard.NovaGuard
api-version: '1.21'
author: Joel
description: Original premium anti-cheat with 38 toggleable checks.
website: https://github.com/reach1234889
softdepend: [floodgate, Geyser-Spigot]
commands:
  novaguard:
    description: NovaGuard admin command
    usage: /novaguard <reload|list|toggle|vl|vlreset|alerts|freeze|wave|wavelist|reports|history>
    aliases: [ng, guard]
    permission: novaguard.admin
  report:
    description: Report a suspected cheater to staff
    usage: /report <player> <reason>
  sus:
    description: Open the suspects GUI with all flagged players
    usage: /sus
    aliases: [suspects]
    permission: novaguard.sus
permissions:
  novaguard.admin:
    description: Full NovaGuard admin access
    default: op
  novaguard.alerts:
    description: Receive NovaGuard violation alerts
    default: op
  novaguard.bypass:
    description: Exempt from all NovaGuard checks
    default: op
  novaguard.sus:
    description: Access the suspects GUI
    default: op
