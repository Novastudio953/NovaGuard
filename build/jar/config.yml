# ============================================================
# NovaGuard v1.2.0 — main settings
# ============================================================

settings:
  alerts-enabled: true
  alert-format: "&8[&cNovaGuard&8] &f{player} &7failed &c{check} &8(VL: {vl})"
  log-to-console: true
  broadcast-punishments: true
  punishment-broadcast: "&8[&cNovaGuard&8] &f{player} &7was punished for &c{check}"
  # seconds before the same player can be punished again for the same check
  punishment-cooldown-seconds: 30
  # VL lost per minute for every check (forgiveness over time)
  vl-decay-per-minute: 1.0
  # players above this ping skip movement checks (lag compensation)
  lag-compensation-max-ping: 350
  # Discord webhook URL for punishment alerts ("none" to disable)
  discord-webhook: "none"
  # ban-wave mode: bans are deferred into a wave list, run /novaguard wave to ban all at once
  ban-wave-mode: false
  # how often (seconds) inventories are scanned for illegal items
  illegal-scan-seconds: 60

# ============================================================
# Bedrock (Geyser/Floodgate) leniency
# Bedrock movement translates differently through Geyser, so the
# checks below are SKIPPED for Bedrock players instead of
# false-banning them. Combat/block/exploit checks still apply.
# No hard dependency: works with or without Floodgate installed.
# ============================================================

bedrock:
  enabled: true
  exempt-checks:
    - fly
    - speed
    - timer
    - jesus
    - step
    - spider
    - scaffold
    - phase
    - elytra
    - boatfly
    - noslow
    - sprintcheck
    - derp
    - baritone
    - reach
    - killaura-angle

# Per-check settings. enabled = toggle, max-vl = violations before
# punishment, punishment = command at max-vl, ban-command = command
# at max-vl * ban-vl-multiplier. {player} {check} {vl} are replaced.
